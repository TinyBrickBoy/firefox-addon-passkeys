name: Build & Release

on:
  push:
    branches: [main]
    tags:
      # Sowohl "1.2.3" als auch "v1.2.3" auslösen
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [main]

env:
  WEB_EXT_IGNORE: --ignore-files ".github/**" "generate-icons.js" "dist/**"

jobs:
  # ─── Lint & Validate ────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: web-ext installieren
        run: npm install -g web-ext

      - name: Addon validieren
        run: web-ext lint --source-dir . ${{ env.WEB_EXT_IGNORE }}

  # ─── Build & Artifact ───────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: web-ext installieren
        run: npm install -g web-ext

      - name: Addon bauen (.zip)
        run: |
          web-ext build \
            --source-dir . \
            --artifacts-dir ./dist \
            ${{ env.WEB_EXT_IGNORE }} \
            --overwrite-dest

      - name: Addon entpacken
        # GitHub packt jedes Artefakt beim Download nochmal in ein ZIP. Würde hier
        # die gebaute .zip hochgeladen, bekäme man ein ZIP im ZIP und AMO meldet
        # beim Hochladen "manifest.json was not found". Entpackt hochgeladen liegt
        # die manifest.json im Download direkt in der Wurzel.
        run: |
          mkdir -p dist/unpacked
          unzip -q dist/*.zip -d dist/unpacked
          test -f dist/unpacked/manifest.json

      - name: Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: linux-passkey-manager
          path: dist/unpacked
          retention-days: 30

  # ─── Release (nur bei Version-Tag) ──────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      # Secrets lassen sich in einer step-"if"-Bedingung nicht direkt abfragen,
      # deshalb hier auf Job-Ebene durchreichen.
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: web-ext installieren
        run: npm install -g web-ext

      # Die Version kommt aus dem Tag ("1.2.0" oder "v1.2.0") und wird in die
      # manifest.json geschrieben. Von Hand hochzählen ist nicht nötig.
      - name: Version aus Tag übernehmen
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME ist keine Version wie 1.2.3"
            exit 1
          fi
          sed -i -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]*(\")/\1$VERSION\2/" manifest.json
          test "$(node -p "require('./manifest.json').version")" = "$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Addon bauen
        run: |
          web-ext build \
            --source-dir . \
            --artifacts-dir ./dist \
            ${{ env.WEB_EXT_IGNORE }} \
            --overwrite-dest

      # Lädt die neue Version bei AMO hoch. Sobald Mozilla sie freigibt, bekommen
      # alle bestehenden Nutzer das Update automatisch über Firefox.
      # Benötigt die Secrets AMO_API_KEY + AMO_API_SECRET
      # (GitHub → Settings → Secrets and variables → Actions).
      - name: Bei AMO einreichen
        if: env.AMO_API_KEY != ''
        run: |
          web-ext sign \
            --source-dir . \
            --artifacts-dir ./dist \
            ${{ env.WEB_EXT_IGNORE }} \
            --channel listed \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --approval-timeout 0

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          name: "Linux Passkey Manager v${{ steps.version.outputs.version }}"
          body: |
            ## Linux Passkey Manager v${{ steps.version.outputs.version }}

            Installation über [addons.mozilla.org](https://addons.mozilla.org/de/firefox/addon/linux-passkey-manager/).
            Bestehende Nutzer bekommen das Update automatisch von Firefox.

            Die angehängte `.zip` ist das gebaute Add-on für manuelle Installation:
            Firefox öffnen → `about:debugging#/runtime/this-firefox` →
            **Temporäres Add-on laden**.
          files: dist/*.zip
          draft: false
          prerelease: false

      # Schreibt die neue Version zurück nach main, damit die manifest.json im
      # Repository zum letzten Release passt.
      - name: Version nach main übernehmen
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git checkout -- manifest.json
          git fetch origin main
          git checkout -B main origin/main
          sed -i -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]*(\")/\1$VERSION\2/" manifest.json
          if git diff --quiet; then
            echo "manifest.json steht auf main schon auf $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to $VERSION"
          git push origin main || echo "::warning::Konnte die Version nicht nach main pushen (Branch-Schutz?). Bitte manifest.json von Hand auf $VERSION setzen."
