<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="popupTitle">Passkey Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="header-text">
      <h1 data-i18n="popupTitle"></h1>
      <p data-i18n="popupSubtitle"></p>
    </div>
  </div>

  <div id="loading" class="state">
    <div class="spinner"></div>
  </div>

  <div id="empty" class="state hidden">
    <div class="state-title" data-i18n="popupEmptyTitle"></div>
    <div class="state-hint" data-i18n="popupEmptyHint"></div>
  </div>

  <ul id="list" class="hidden"></ul>

  <div id="dialog" class="dialog-backdrop hidden">
    <div class="dialog">
      <h2 data-i18n="popupDeleteTitle"></h2>
      <p id="dialog-msg"></p>
      <div class="dialog-actions">
        <button id="btn-cancel" class="btn btn-secondary" data-i18n="buttonCancel"></button>
        <button id="btn-confirm" class="btn btn-danger" data-i18n="buttonDelete"></button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
